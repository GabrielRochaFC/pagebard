[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagebard"
version = "0.1.0"
description = "Reads PDFs aloud, offline, with natural Piper voices"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Rocha" }]
keywords = ["pdf", "text-to-speech", "tts", "piper", "accessibility", "ocr", "audiobook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Spanish",
]
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.26",
    "piper-tts>=1.3",
]

[project.urls]
Homepage = "https://github.com/GabrielRochaFC/pagebard"
Issues = "https://github.com/GabrielRochaFC/pagebard/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
pagebard = "pagebard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagebard = ["locale/*.po"]

[tool.pytest.ini_options]
testpaths = ["tests"]
