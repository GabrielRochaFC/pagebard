[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagebard"
version = "0.1.0"
description = "Lê PDFs em voz alta, offline, com vozes Piper"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.26",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
pagebard = "pagebard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
